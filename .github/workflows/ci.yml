name: Validate blog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.17.0
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.0

      - name: Check types
        run: pnpm check

      - name: Build site
        run: pnpm build
