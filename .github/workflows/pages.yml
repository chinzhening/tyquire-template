name: Deploy blog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.17.0
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.0

      - name: Set Pages base path
        run: |
          if [ "${{ vars.PAGES_CUSTOM_DOMAIN }}" = "true" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "BASE_PATH=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
